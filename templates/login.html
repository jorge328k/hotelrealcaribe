{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysHSENA - Acceso al Sistema | Hotel Real Caribe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page-body">

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-5 col-xl-4">
                
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white bg-opacity-95">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-block mb-3">
                            <img src="{% static 'img/logo2.png' %}" alt="Logo Real Caribe" class="rounded-circle border border-2 border-primary shadow-sm" style="width: 70px; height: 70px; object-fit: cover;">
                        </div>
                        <h3 class="fw-bold text-dark">Hotel Real Caribe</h3>
                        <p class="text-muted small mb-0">Bienvenidos</p>
                    </div>

                    {% if messages %}
                        <div class="mb-3">
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show small" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="POST" action="">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-muted small">CORREO O USUARIO</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Ingrese su usuario" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-muted small">CONTRASEÑA</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-caribe py-2 fw-bold shadow-sm">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <p class="small text-muted mb-0">¿No tienes una cuenta? <a href="{% url 'registro' %}" class="text-decoration-none fw-bold text-primary">Regístrate aquí</a></p>
                        </div>

                    </form>

                </div>

                <div class="text-center mt-3 text-white-50 small">
                    <p class="mb-0">2026 Hotel Real Caribe - Riohacha, La Guajira</p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
