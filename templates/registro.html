{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - SysHSENA | Hotel Real Caribe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page-body">

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-6 col-xl-5">
                
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white bg-opacity-95">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-block mb-3">
                            <img src="{% static 'img/logo2.png' %}" alt="Logo Real Caribe" class="brand-logo-img rounded-circle shadow-sm" style="width: 70px; height: 70px; object-fit: cover;">
                        </div>
                        <h3 class="fw-bold text-dark">Hotel Real Caribe</h3>
                        <p class="text-muted small mb-0">Registro de Nueva Cuenta</p>
                    </div>

                    {% if messages %}
                        <div class="mb-3">
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show small" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="POST" action="">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-muted small">USUARIO</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 solo-usuario" id="username" name="username" placeholder="Elige un usuario" minlength="4" maxlength="30" pattern="[A-Za-z0-9_]{4,30}" title="Entre 4 y 30 caracteres: solo letras, números y guion bajo (_)" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="tipo_documento" class="form-label fw-semibold text-muted small">TIPO DE IDENTIDAD</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-id-card text-muted"></i></span>
                                <select class="form-select border-start-0 ps-0" id="tipo_documento" name="tipo_documento" required>
                                    <option value="" selected disabled>Seleccione el tipo...</option>
                                    <option value="CC">Cédula de Ciudadanía (CC)</option>
                                    <option value="CE">Cédula de Extranjería (CE)</option>
                                    <option value="TI">Tarjeta de Identidad (TI)</option>
                                    <option value="PA">Pasaporte (PA)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="numero_documento" class="form-label fw-semibold text-muted small">NÚMERO DE IDENTIFICACIÓN</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-hashtag text-muted"></i></span>
                                <input type="text" inputmode="numeric" class="form-control border-start-0 ps-0 solo-numeros" id="numero_documento" name="numero_documento" placeholder="Ej. 1123456789" minlength="6" maxlength="15" pattern="[0-9]{6,15}" title="Solo números, entre 6 y 15 dígitos" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label fw-semibold text-muted small">TELÉFONO</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-phone text-muted"></i></span>
                                <input type="text" inputmode="numeric" class="form-control border-start-0 ps-0 solo-telefono" id="telefono" name="telefono" placeholder="Ej. 3001234567" minlength="7" maxlength="10" pattern="[0-9]{7,10}" title="Solo números, entre 7 y 10 dígitos">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-muted small">CORREO ELECTRÓNICO</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" maxlength="100" placeholder="correo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="departamento" class="form-label fw-semibold text-muted small">DEPARTAMENTO</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-map text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 solo-letras" id="departamento" name="departamento" placeholder="Ej. La Guajira" minlength="2" maxlength="60" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,60}" title="Solo letras y espacios" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="municipio" class="form-label fw-semibold text-muted small">MUNICIPIO</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-location-dot text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 solo-letras" id="municipio" name="municipio" placeholder="Ej. Riohacha" minlength="2" maxlength="60" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,60}" title="Solo letras y espacios" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-muted small">CONTRASEÑA</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" minlength="6" maxlength="128" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-caribe py-2 fw-bold shadow-sm">
                                <i class="fa-solid fa-paper-plane me-2"></i> Registrarse
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <a href="{% url 'login' %}" class="small text-decoration-none text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Volver al Login</a>
                        </div>

                    </form>

                </div>

                <div class="text-center mt-3 text-white-50 small">
                    <p class="mb-0">2026 Hotel Real Caribe - Riohacha, La Guajira</p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.solo-numeros').forEach(function(input) {
            const limite = parseInt(input.getAttribute('maxlength')) || 15;
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '').slice(0, limite);
            });
        });

        document.querySelectorAll('.solo-telefono').forEach(function(input) {
            const limite = parseInt(input.getAttribute('maxlength')) || 10;
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '').slice(0, limite);
            });
        });

        document.querySelectorAll('.solo-letras').forEach(function(input) {
            const limite = parseInt(input.getAttribute('maxlength')) || 60;
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ\s]/g, '').slice(0, limite);
            });
        });

        document.querySelectorAll('.solo-usuario').forEach(function(input) {
            const limite = parseInt(input.getAttribute('maxlength')) || 30;
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^A-Za-z0-9_]/g, '').slice(0, limite);
            });
        });
    </script>
</body>
</html>
