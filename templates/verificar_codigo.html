{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - SysHSENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page-body">
    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white bg-opacity-95">
                    <div class="text-center mb-4">
                        <div class="text-info mb-2"><i class="fa-solid fa-shield-halved fs-1"></i></div>
                        <h3 class="fw-bold text-dark">Verificar Correo</h3>
                        <p class="text-muted small mb-0">Hemos enviado un código de 6 dígitos a tu bandeja de entrada.</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show small" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" action="">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-muted small">CÓDIGO DE VERIFICACIÓN</label>
                            <input type="text" class="form-control text-center fs-4 tracking-widest" name="codigo" placeholder="123456" maxlength="6" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-caribe py-2 fw-bold shadow-sm">
                                <i class="fa-solid fa-check-circle me-2"></i> Verificar y Registrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
